<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的 C++ Web 服务器</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a2e;
            color: #eee;
        }

        h1 {
            color: #e94560;
        }

        .card {
            background: #16213e;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            border-left: 4px solid #e94560;
        }

        code {
            background: #0f3460;
            padding: 2px 8px;
            border-radius: 4px;
            color: #00d9ff;
        }
    </style>
</head>
<body>
    <h1>🚀 欢迎来到我的 C++ Web 服务器</h1>
    <div class="card">
        <h3>这是纯 C++ 手写的 Web 服务器</h3>
        <p>没有 Nginx，没有 Apache，没有框架。</p>
        <p>从 <code>socket()</code> 到 <code>send()</code>，每一行都是 C++。</p>
    </div>
    <div class="card">
        <h3>技术栈</h3>
        <ul>
            <li>Windows Winsock2 API</li>
            <li>HTTP/1.1 协议手动解析</li>
            <li>多线程并发处理</li>
            <li>静态文件服务</li>
        </ul>
    </div>
</body>
</html>
